# Unified-mode example: one service with a static dictionary, and one that
# trains a dictionary automatically from live TCP traffic.
# Run: rathole --server examples/compression.toml
#      rathole --client examples/compression.toml
#
# Relative dictionary paths resolve against this file's directory (`examples/`),
# not the process working directory. Place `service.dict` next to this config
# (so the resolved path is `examples/service.dict`), or use an absolute path.
#
# Train a static dictionary offline, then copy the same bytes to both hosts:
#   zstd --train /path/to/sample/payloads/*.json -o service.dict --maxdict=112640
#
# Compression is server-side only. Do not set `compression` under `[client.services.*]`.
# Upgrade all clients before upgrading a server that has `compression = "zstd"`.

[client]
remote_addr = "localhost:2333"
default_token = "123"

[client.services.loki]
local_addr = "127.0.0.1:3100"
compression_dictionary = "service.dict"

[server]
bind_addr = "0.0.0.0:2333"
default_token = "123"

[server.services.loki]
bind_addr = "0.0.0.0:3100"
compression = "zstd"
compression_dictionary = "service.dict"

# Automatic dictionary: omit `compression_dictionary`. After
# `compression_sample_window` bytes of TCP plaintext (both directions),
# the server trains one in-memory dictionary via zstd::dict::from_continuous
# and pushes it to the client. UDP services never auto-train.
#
# Defaults if the keys below are omitted: auto = true,
# window = 134217728 (128 MiB), max_size = 112640 (110 KiB),
# compression_level = 9 (zstd 1..=22).
# Window must be at least 100× max_size. max_size must not exceed 16777216.
# Set `compression_auto_dictionary = false` to opt out.
# Set `compression_level = 19` for slower, denser zstd; that uses a newer
# data-channel command, so upgrade clients first.

[client.services.clickhouse]
local_addr = "127.0.0.1:8123"

[server.services.clickhouse]
bind_addr = "0.0.0.0:8123"
compression = "zstd"
compression_auto_dictionary = true
compression_sample_window = 134217728
compression_dictionary_max_size = 112640
